plugins { id 'com.android.application' }
android {
    namespace 'tw.ynfly.bbanalyzer'
    compileSdk 34
    defaultConfig {
        applicationId 'tw.ynfly.bbanalyzer'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }
    signingConfigs {
        release {
            storeFile file('../keystore/release.jks')
            storePassword 'bbanalyzer'
            keyAlias 'bbanalyzer'
            keyPassword 'bbanalyzer'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
