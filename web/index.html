<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RC 飛行模擬</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#fff;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));pointer-events:none}
#tele{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:rgba(10,16,24,.55);backdrop-filter:blur(6px);border-radius:10px;padding:5px 10px;font-size:13px;line-height:1.15;min-width:64px}
.pill b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.pill small{opacity:.7;font-size:11px}
#btns{display:flex;gap:6px;pointer-events:auto}
.btn{background:rgba(10,16,24,.6);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:10px;height:40px;min-width:44px;padding:0 10px;font-size:14px;font-weight:600}
.btn:active{background:rgba(255,120,40,.7)}
.btn.on{background:rgba(255,110,30,.75)}
#pip{position:fixed;display:none;border:2px solid rgba(255,255,255,.55);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.45);pointer-events:none;z-index:2}
#pip span{position:absolute;top:4px;left:8px;font-size:11px;font-weight:700;text-shadow:0 1px 3px #000;opacity:.9}

.screen{position:fixed;inset:0;z-index:20;display:none;overflow:auto;padding:max(16px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) 18px max(22px,env(safe-area-inset-left));background:linear-gradient(160deg,rgba(14,32,58,.92),rgba(6,10,16,.88));backdrop-filter:blur(6px)}
.screen.show{display:block}
.homeTitle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.homeTitle h1{font-size:34px;margin:4px 0}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.mode{position:relative;border:0;border-radius:18px;padding:18px 16px 16px;text-align:left;color:#fff;min-height:150px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.mode .ic{font-size:34px}
.mode b{display:block;font-size:21px;margin:6px 0 4px}
.mode span{font-size:13px;opacity:.85;line-height:1.4}
.mode:active{transform:scale(.98)}
.m-free{background:linear-gradient(135deg,#ff8a1f,#e2442f)}
.m-tut{background:linear-gradient(135deg,#2f9e6e,#1c6aa8)}
.m-exam{background:linear-gradient(135deg,#7b4fd6,#3b3fa8)}
.badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:20px}
.homeBar{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.back{background:none;border:0;color:#fff;font-size:15px;padding:6px 0;opacity:.85}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.lsn{background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:14px;padding:12px;color:#fff;text-align:left;position:relative}
.lsn:active{border-color:#2f9e6e}
.lsn .n{font-size:12px;opacity:.6}
.lsn b{display:block;font-size:18px;margin:3px 0}
.lsn span{font-size:12px;opacity:.75}
.lsn .ok{position:absolute;top:10px;right:12px;color:#4cd98a;font-weight:800}
#dlg{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
#dlg.show{display:flex}
#dlg .box{background:#121b26;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px 20px;max-width:560px;width:100%;max-height:100%;overflow:auto}
#dlg h2{margin:0 0 8px;font-size:24px}
#dlg p{white-space:pre-line;line-height:1.55;font-size:15px;margin:0 0 6px;opacity:.92}
#dlg .acts{display:flex;gap:10px;margin-top:14px}
#dlg .acts button{flex:1;height:46px;border:0;border-radius:12px;font-size:16px;font-weight:700;color:#fff;background:rgba(255,255,255,.12)}
#dlg .acts button.pri{background:linear-gradient(90deg,#2f9e6e,#1c6aa8)}
#tut{position:fixed;top:62px;left:50%;transform:translateX(-50%);width:min(520px,54vw);background:rgba(10,20,30,.72);backdrop-filter:blur(6px);border:1px solid rgba(76,217,138,.45);border-radius:14px;padding:8px 14px;display:none;pointer-events:none;z-index:3}
#tut.show{display:block}
#tut .hd{font-size:12px;opacity:.75;display:flex;justify-content:space-between}
#tut .tx{font-size:17px;font-weight:700;margin-top:3px;line-height:1.35}
#tut .hi{font-size:13px;color:#ffd54f;margin-top:2px;min-height:16px}
#tut.good{border-color:#4cd98a;box-shadow:0 0 22px rgba(76,217,138,.7)}
.base.hl{border-color:#ffd54f;box-shadow:0 0 22px rgba(255,213,79,.55)}
.arr{position:absolute;left:50%;top:50%;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:22px solid #ffd54f;margin:-11px 0 0 -14px;animation:pulse 1s infinite;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
#mini{position:fixed;top:58px;right:max(10px,env(safe-area-inset-right));width:190px;height:104px;border-radius:10px;border:1px solid rgba(255,255,255,.35);display:none;pointer-events:none;z-index:3}
#dP .chk{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
#dP .chk button{text-align:left;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:9px 10px;font-size:14px}
#dP .chk button.on{background:rgba(47,158,110,.35);border-color:#4cd98a}
table.rep{width:100%;border-collapse:collapse;font-size:14px}
table.rep td{padding:3px 4px}
table.rep .sc{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
table.rep .nt{font-size:12px;opacity:.65;padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.08)}
#warn{position:fixed;top:64px;left:50%;transform:translateX(-50%);font-weight:800;font-size:20px;color:#ff5252;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .2s;pointer-events:none}
#toast{position:fixed;top:46%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#toast h2{margin:0;font-size:34px;text-shadow:0 3px 12px rgba(0,0,0,.6)}
#toast p{margin:6px 0 0;font-size:15px;opacity:.9;text-shadow:0 2px 6px #000}
.stick{position:fixed;bottom:0;width:50%;height:72%;pointer-events:auto}
#stickL{left:0}#stickR{right:0}
.base{position:absolute;width:150px;height:150px;border-radius:24px;border:2px solid rgba(255,255,255,.35);background:rgba(10,16,24,.25);pointer-events:none}
.base::before,.base::after{content:"";position:absolute;background:rgba(255,255,255,.2)}
.base::before{left:50%;top:8px;bottom:8px;width:1px}.base::after{top:50%;left:8px;right:8px;height:1px}
.knob{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bbb 60%,#777);box-shadow:0 3px 10px rgba(0,0,0,.5)}
.lbl{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;opacity:.65}
#panel,#menu{position:fixed;inset:0;z-index:10;background:rgba(6,10,16,.82);backdrop-filter:blur(8px);display:none;overflow:auto;padding:max(16px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 20px max(20px,env(safe-area-inset-left))}
#panel.show,#menu.show{display:block}
.card{max-width:760px;margin:0 auto}
h1{font-size:30px;margin:6px 0 2px}h3{margin:18px 0 8px;font-size:15px;opacity:.85}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.opt{flex:1;min-width:120px;background:rgba(255,255,255,.07);border:2px solid transparent;border-radius:12px;padding:10px;color:#fff;text-align:left;font-size:14px}
.opt.sel{border-color:#ff7a1a;background:rgba(255,122,26,.15)}
.opt b{display:block;font-size:16px;margin-bottom:2px}
.opt span{opacity:.7;font-size:12px}
label.sl{display:flex;align-items:center;gap:10px;font-size:14px;margin:8px 0}
label.sl span{min-width:92px}
label.sl input[type=range]{flex:1;accent-color:#ff7a1a}
label.sl output{min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.go{display:block;width:100%;margin:18px 0 6px;height:52px;border:0;border-radius:14px;background:linear-gradient(90deg,#ff7a1a,#ff4d3a);color:#fff;font-size:19px;font-weight:800}
table.map{width:100%;border-collapse:collapse;font-size:13px}
table.map td{padding:5px 4px}
table.map select{background:#1b2430;color:#fff;border:1px solid #445;border-radius:6px;padding:4px}
.bar{height:8px;background:#223;border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:#ff7a1a;width:50%}
.mini{font-size:12px;opacity:.65;line-height:1.5}
.foot{text-align:center;font-size:12px;opacity:.5;margin-top:10px}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="tele">
    <div class="pill"><small>空速</small><b id="tSpd">0</b><small>km/h</small></div>
    <div class="pill"><small>高度</small><b id="tAlt">0</b><small>m</small></div>
    <div class="pill"><small>油門</small><b id="tThr">0</b><small>%</small></div>
    <div class="pill"><small>距離</small><b id="tDst">0</b><small>m</small></div>
  </div>
  <div id="btns">
    <button class="btn" id="bCam">視角</button>
    <button class="btn" id="bPip">小窗</button>
    <button class="btn" id="bSmoke">煙</button>
    <button class="btn" id="bAir">空中</button>
    <button class="btn" id="bReset">重置</button>
    <button class="btn" id="bMenu">☰</button>
  </div>
</div>
<div id="warn">失速！</div>
<div id="toast"><h2 id="toastT"></h2><p id="toastP"></p></div>


<div id="home" class="screen show">
  <div class="card">
    <div class="homeTitle"><h1>✈︎ RC 飛行模擬</h1><span class="mini">第三人稱航空模型飛機模擬器</span></div>
    <div class="modes">
      <button class="mode m-free" id="mFree"><div class="ic">🛩️</div><b>自由模式</b><span>選擇飛機與視角，想怎麼飛就怎麼飛</span></button>
      <button class="mode m-tut" id="mTut"><div class="ic">🎓</div><b>新手教學</b><span>一步步學會四個操作桿與降落要領</span><div class="badge" id="tutProg">0/5</div></button>
      <button class="mode m-exam" id="mExam"><div class="ic">📋</div><b>考照模式</b><span>依民航局無人飛機（定翼）術科基準：滑行、起飛、五邊、8 字、降落、迫降</span><div class="badge" id="examBadge">定翼術科</div></button>
    </div>
    <div class="homeBar"><button class="btn" id="hSet">⚙ 設定</button><span class="mini">by ynfly_fpv</span></div>
  </div>
</div>

<div id="tutList" class="screen">
  <div class="card">
    <button class="back" id="tlBack">‹ 返回</button>
    <h1>🎓 新手教學</h1>
    <div class="mini">建議依序完成。教學使用練習機，視角依照設定（建議地面目視）。</div>
    <div class="lessons" id="lessons"></div>
  </div>
</div>

<div id="dlg"><div class="box"><h2 id="dT"></h2><p id="dP"></p><div class="acts" id="dA"></div></div></div>
<div id="tut"><div class="hd"><span id="tutL"></span><span id="tutN"></span></div><div class="tx" id="tutT"></div><div class="hi" id="tutH"></div></div>
<canvas id="mini"></canvas>
<div id="pip"><span></span></div>
<div class="stick" id="stickL"><div class="base"><div class="knob"></div><div class="lbl"></div></div></div>
<div class="stick" id="stickR"><div class="base"><div class="knob"></div><div class="lbl"></div></div></div>

<div id="menu">
  <div class="card">
    <h1>⚙ 設定</h1>

    <h3>選擇飛機</h3>
    <div class="row" id="planeSel"></div>

    <h3>操作視角</h3>
    <div class="row" id="camSel"></div>
    <div id="pipRow"><h3>地面目視模式：正下方小視窗</h3>
    <div class="row" id="pipSel"></div></div>

    <h3>操控</h3>
    <div class="row" id="modeSel">
      <button class="opt" data-mode="2"><b>Mode 2（美國手）</b><span>左：油門／方向　右：升降／副翼</span></button>
      <button class="opt" data-mode="1"><b>Mode 1（日本手）</b><span>左：升降／方向　右：油門／副翼</span></button>
    </div>
    <label class="sl"><span>舵量</span><input type="range" id="sRate" min="30" max="130" step="5"><output></output></label>
    <label class="sl"><span>Expo 指數</span><input type="range" id="sExpo" min="0" max="80" step="5"><output></output></label>
    <label class="sl"><span>風速</span><input type="range" id="sWind" min="0" max="10" step="1"><output></output></label>
    <label class="sl"><span>陣風</span><input type="range" id="sGust" min="0" max="100" step="10"><output></output></label>
    <label class="sl"><span>畫質</span><input type="range" id="sQual" min="0" max="1" step="1"><output></output></label>
    <label class="sl"><span>引擎聲音</span><input type="range" id="sVol" min="0" max="100" step="10"><output></output></label>

    <h3>USB 遙控器／手把</h3>
    <div class="mini">把遙控器用 USB OTG 接上手機並選「搖桿 (Joystick)」模式。按「偵測」後撥動對應的搖桿即可自動對應。</div>
    <table class="map" id="mapTbl"></table>
    <div class="row"><button class="btn" id="bPad">遙控器：關</button><span class="mini" id="padInfo">尚未偵測到遙控器</span></div>

    <button class="go" id="bGo">繼續飛行</button>
    <button class="btn" id="bHome" style="width:100%;height:44px">回主畫面</button>
    <div class="mini" style="margin-top:8px">小技巧：油門推到底滑跑，速度夠了輕輕往下拉升降舵起飛。地面視角最像真實飛 RC，飛機朝你飛來時左右是反的！</div>
  </div>
</div>

<script>/*BUNDLE*/</script>
</body>
</html>
