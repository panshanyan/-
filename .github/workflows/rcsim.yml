name: Build RC Sim APK
on:
  push:
    branches: [rc-sim]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Bundle game (three.js)
        run: npm ci && node web/build.mjs
      - name: Local properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk RCFlightSim-v${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rcsim-v${{ github.run_number }}
          name: RC 飛行模擬 v${{ github.run_number }}
          body: 下載下面的 RCFlightSim-v${{ github.run_number }}.apk 安裝到手機（橫向遊玩）。
          files: RCFlightSim-v${{ github.run_number }}.apk
          make_latest: false
          target_commitish: ${{ github.sha }}
