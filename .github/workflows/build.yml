name: Build APK
on:
  push:
    branches: [bb-analyzer]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk BBAnalyzer-v${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 黑盒子分析 v${{ github.run_number }}
          body: 下載下面的 BBAnalyzer-v${{ github.run_number }}.apk 安裝。
          files: BBAnalyzer-v${{ github.run_number }}.apk
          make_latest: true
          target_commitish: ${{ github.sha }}
